name: CI — dbt pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dbt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-postgres
        run: pip install dbt-postgres==1.10.0

      - name: Create dbt profiles.yml
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p ~/.dbt
          python3 -c "
          import os, re
          url = os.environ['DATABASE_URL']
          m = re.match(r'postgresql://([^:]+):([^@]+)@([^:/]+):(\d+)/(.+)', url)
          user, pwd, host, port, dbname = m.groups()
          content = f'''deliveryops_dbt:
            target: dev
            outputs:
              dev:
                type: postgres
                host: {host}
                user: {user}
                password: {pwd}
                port: {int(port)}
                dbname: {dbname}
                schema: analytics
                threads: 4
                sslmode: require
          '''
          open(os.path.expanduser('~/.dbt/profiles.yml'), 'w').write(content)
          print('profiles.yml criado')
          "

      - name: dbt run
        run: |
          cd deliveryops_dbt
          dbt run

      - name: dbt test
        run: |
          cd deliveryops_dbt
          dbt test
