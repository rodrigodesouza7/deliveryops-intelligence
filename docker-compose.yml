services:
  streamlit:
    build: .
    container_name: deliveryops_streamlit
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: always

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: deliveryops_airflow_init
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow:/opt/airflow
      - ./deliveryops_dbt:/opt/airflow/deliveryops_dbt
      - ~/.dbt:/home/airflow/.dbt
    command: >
      bash -c "airflow db init &&
               airflow users create
               --username admin
               --password admin
               --firstname Rodrigo
               --lastname Souza
               --role Admin
               --email admin@example.com"

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: deliveryops_airflow_webserver
    depends_on:
      - airflow-init
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow:/opt/airflow
      - ./deliveryops_dbt:/opt/airflow/deliveryops_dbt
      - ~/.dbt:/home/airflow/.dbt
    ports:
      - "8080:8080"
    command: webserver
    restart: always

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: deliveryops_airflow_scheduler
    depends_on:
      - airflow-webserver
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow:/opt/airflow
      - ./deliveryops_dbt:/opt/airflow/deliveryops_dbt
      - ~/.dbt:/home/airflow/.dbt
    command: scheduler
    restart: always
